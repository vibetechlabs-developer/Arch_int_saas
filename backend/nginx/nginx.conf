# Reverse proxy in front of Gunicorn (BE-020). Plain HTTP only, matching
# 07_DevOps/Development_Environment.md §5 ("no TLS locally" — production
# TLS termination happens at the load balancer per 07_DevOps/Production.md
# §3, not here). Serves static/media directly so Gunicorn workers aren't
# spending threads on file I/O (07_DevOps/Docker.md §5 / this task's plan §10).

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- TLS scaffold for a real deployment ---------------------------------
    # Production TLS termination happens at the load balancer
    # (07_DevOps/Production.md §3), not in this container. Left here only as
    # a documented starting point if this nginx image is ever asked to
    # terminate TLS itself in an environment without an upstream LB.
    #
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
}
