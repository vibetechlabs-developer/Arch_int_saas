# Serves the built SPA (frontend/Dockerfile's `production` stage). Plain
# HTTP only -- TLS termination happens at the host's own nginx reverse proxy
# in front of this container (see the deployment guide), matching the
# backend nginx's own documented convention.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (Vite fingerprints every filename) are safe to
    # cache forever -- a new deploy ships new filenames, never reuses one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing fallback: every unmatched path (a client-side route like
    # /leads/:id) serves index.html and lets React Router take over, rather
    # than nginx 404ing on a real page. index.html itself is explicitly
    # never cached -- it's the one file that references the current
    # content-hashed bundle by name, so a stale cached copy of it silently
    # keeps serving an old (or, worse, a placeholder-value) JS bundle
    # forever after a real deploy, with no visible error beyond a broken
    # API call. The hashed /assets/ files above are the only things safe
    # to cache long-term.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
