# Local development stack for INT Projects SaaS backend (BE-020).
# `docker compose up` brings up Postgres, Redis, the Django API (hot-reload),
# Celery worker/beat (scaffolding — no tasks registered yet), and nginx as
# the reverse proxy in front of Gunicorn.
#
# Setup: copy backend/.env.example to backend/.env first
# (07_DevOps/Development_Environment.md §2) — the app-tier services below
# read it via env_file.
#
# Frontend/S3-emulator services from 07_DevOps/Docker.md's indicative
# compose (web, minio) are intentionally not included here — no frontend
# code exists in this repo yet, and this compose file always runs the
# backend in its default STORAGE_BACKEND=local mode (BE-078), which needs
# no object-storage service. A real deployment sets STORAGE_BACKEND=s3 via
# its own environment/secrets, at which point neither the `media` nor
# `media_private` named volumes below are used at all — see
# backend/.env.example's Object Storage section.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: int_projects_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./backend
      target: dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
      - media_private:/app/media_private
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery-worker:
    build:
      context: ./backend
      target: dev
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      target: dev
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      django:
        condition: service_healthy

volumes:
  pgdata:
  staticfiles:
  media:
  # Deliberately not mounted into the nginx service above — private files
  # (documents, expense/payment receipts) are only ever served through the
  # Django app's own authenticated, tenant/RBAC-checked download proxy
  # views (apps.common.storage.open_private_file), never through nginx's
  # public /media/ alias.
  media_private:
